name: Check File Size

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - '**'

jobs:
  check-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for large files
        run: |
          MAX_SIZE=10485760  # 10MB in bytes
          
          # Get the list of files in the push/PR
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            # Try event range; fallback to HEAD^ if rebase/force-push made the 'before' hash invalid
            files=$(git diff --name-only ${{ github.event.before }}..${{ github.sha }} 2>/dev/null || \
                    git diff --name-only HEAD^1 HEAD 2>/dev/null || \
                    git ls-files)
          fi
          
          echo "Checking file sizes..."
          large_files_found=0
          
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
              if [ "$size" -gt "$MAX_SIZE" ]; then
                size_mb=$((size / 1024 / 1024))
                echo "❌ Error: File '$file' is too large (${size_mb}MB). Maximum allowed: 10MB"
                large_files_found=1
              fi
            fi
          done <<< "$files"
          
          if [ $large_files_found -eq 1 ]; then
            echo "❌ Push rejected: Large files detected"
            exit 1
          fi
          
          echo "✅ All files are within size limits"