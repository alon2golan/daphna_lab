dataset:
  name: esc50
  manifest: /cs/labs/daphna/yael.bs444/projects/daphna_lab/audio_embeddings/data/datasets/ESC-50/ecs50.jsonl
model:
  name: ssast
  checkpoint: /cs/labs/daphna/yael.bs444/projects/daphna_lab/audio_embeddings/models_src/SSAST/pretrained_model/SSAST-Base-Frame-400.pth
  checkpoint_metadata: D:/checkpoints/ssast_pretrained.provenance.json
adaptation: frozen_representation
objective:
  name: cross_entropy
  task: multiclass
  target: class_index
device: cuda
output: /cs/labs/daphna/yael.bs444/projects/daphna_lab/audio_embeddings/outputs/esc50
report_full_label_reference: true
seeds: [42, 44, 46]
budget:
  unit: percent
  values: [2.5, 5, 7.5, 10]
training:
  epochs: 20
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  hidden_sizes: [512]
  dropout: 0.2
  cls_alpha_long: 0.9999
  cls_alpha_short: 0.85
extraction:
  batch_size: 16
preprocessing:
  channel_mode: mean
  pad_mode: constant
  window_seconds: 10.24
acquisition:
  initial_random_count: 1
  feature_transform: l2
  delta: 0.25
  mc_passes: 20
