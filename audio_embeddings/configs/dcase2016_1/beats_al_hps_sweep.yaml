# DCASE 2016 Task 1 with BEATs, using the same non-CLS sweep matrix.
base_config: ../esc50/beats_al_hps_sweep.yaml

dataset:
  name: dcase2016-1
  manifest: /cs/labs/daphna/yael.bs444/projects/daphna_lab/audio_embeddings/data/datasets/DCASE-2016-1/dcase2016_1.jsonl
model:
  name: beats
  checkpoint: /cs/labs/daphna/yael.bs444/projects/daphna_lab/audio_embeddings/models_src/BEATs/ckpts/BEATs_iter3_plus_AS2M.pt
  checkpoint_metadata: /cs/labs/daphna/yael.bs444/projects/daphna_lab/audio_embeddings/models_src/BEATs/ckpts/beats_pretrained.provenance.json
output: /cs/labs/daphna/yael.bs444/outputs/dcase2016-1-beats
feature_cache: /cs/labs/daphna/yael.bs444/projects/daphna_lab/audio_embeddings/features/dcase2016-1-beats/feature_cache
audio_index: /cs/labs/daphna/yael.bs444/projects/daphna_lab/audio_embeddings/data/datasets/DCASE-2016-1/audio_index.json
report_full_label_reference: false
folds: [1, 2, 3, 4]
budget:
  unit: percent
  values: [2.5, 5, 10, 20, 30]
preprocessing:
  channel_mode: mean
  pad_mode: constant
  window_seconds: 10
